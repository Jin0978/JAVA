<body>
  <div class="login-container">
    <!-- 왼쪽 영역 -->
    <div class="login-left">

      </div>

      <form id="loginForm">
        <!-- 아이디 입력 -->

          <label class="form-label">아이디</label>
          <div class="input-icon">

            <input type="password" class="form-control" id="password" placeholder="비밀번호를 입력하세요" required>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 비밀번호 표시/숨김 토글
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', function () {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.classList.toggle('bi-eye');
      this.classList.toggle('bi-eye-slash');
    });

    // ==========================================================
    // ⭐ 서버와 통신하는 로그인 폼 제출 로직 (localStorage 저장) ⭐
    // ==========================================================
    const loginForm = document.getElementById('loginForm');

    // (!!중요!!) 백엔드 로그인 API 주소 설정
    const LOGIN_API_URL = '/api/auth/login';

    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      // 1. 폼 데이터 수집
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // 2. 백엔드로 보낼 JSON 데이터 만들기
      const loginData = {
        username: username,
        password: password
      };

      try {
        // 3. 백엔드 /api/auth/login API로 POST 요청 보내기
        const response = await fetch(LOGIN_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(loginData)
        });

        // 4. 백엔드 응답 처리
        const responseBody = await response.json();

        if (response.ok && responseBody.success) { // 로그인 성공
          alert(responseBody.username + '님, 환영합니다!');

          // ⭐ 5. 브라우저 저장소(localStorage)에 로그인 정보를 저장합니다.
          localStorage.setItem('userId', responseBody.userId);
          localStorage.setItem('username', responseBody.username);
          localStorage.setItem('userRole', responseBody.role); // ⭐ Role 저장 추가

          // ⭐ 6. URL 파라미터 없이 메인 페이지로 이동합니다.
          window.location.href = 'auction_site_main.html';

        } else { // 로그인 실패 (아이디/비밀번호 오류)
          alert('로그인 실패: ' + responseBody.message);
        }

      } catch (error) {
        // 네트워크 오류 또는 서버 문제
        console.error('로그인 요청 실패:', error);
        alert('서버에 연결할 수 없습니다. 서버가 켜져 있는지 확인해주세요.');
      }
    });
  </script>
